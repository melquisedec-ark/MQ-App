name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version label (e.g. 1.0.9)'
        required: false
        default: 'latest'
  push:
    branches:
      - mq-app-init
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release — split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MQ_App-android-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          compression-level: 0

      - name: Upload to GitHub Release (solo en workflow_dispatch o tags)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          # Crear release si no existe (ej. workflow_dispatch con version='latest')
          if ! gh release view "$TAG" &>/dev/null; then
            echo "🆕 Release '$TAG' no existe. Creándolo..."
            gh release create "$TAG" \
              --title "Build $TAG" \
              --notes "Build automático desde branch ${{ github.ref_name }}" \
              --latest=false
          fi
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --clobber
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk --clobber
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-x86_64-release.apk --clobber

  build-aab:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/mq-app-init')
    needs: build-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup keystore (si existen secrets)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/mqapp.keystore
          echo "$KEYSTORE_PROPERTIES" > android/key.properties
        continue-on-error: true

      - name: Build AAB release (con keystore si disponible)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQ_App-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0

      - name: Upload AAB to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          # Crear release si no existe (ej. workflow_dispatch con version='latest')
          if ! gh release view "$TAG" &>/dev/null; then
            echo "🆕 Release '$TAG' no existe. Creándolo..."
            gh release create "$TAG" \
              --title "Build $TAG" \
              --notes "Build automático desde branch ${{ github.ref_name }}" \
              --latest=false
          fi
          gh release upload "$TAG" build/app/outputs/bundle/release/app-release.aab --clobber
