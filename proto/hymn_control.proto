syntax = "proto3";

package mqapp;

// ──────────────────────────────────────────────
// Servicio de control remoto para MQ App 2.0
// Comunicación LAN entre Controlador (móvil) y Display (PC/TV)
// ──────────────────────────────────────────────

service HymnControl {
  // Comandos del controlador al display
  rpc SendCommand (CommandRequest) returns (CommandResponse);

  // Obtener estado actual del display
  rpc GetStatus (Empty) returns (DisplayStatus);

  // Streaming de estado (el display notifica cambios en tiempo real)
  rpc WatchStatus (Empty) returns (stream DisplayStatus);

  // Handshake de conexión inicial
  rpc Handshake (HandshakeRequest) returns (HandshakeResponse);

  // ─── NUEVOS RPCs ──────────────────────────────────────────
  // Enviar contenido completo de un himno al display remoto.
  // El controlador envía el payload completo (título + estrofas).
  rpc SendHymnContent (HymnPayload) returns (CommandResponse);

  // Obtener lista de fondos disponibles en el PC (dueño de los archivos multimedia).
  rpc GetAvailableBackgrounds (Empty) returns (BackgroundList);
}

// ──────────────────────────────────────────────
// Mensajes
// ──────────────────────────────────────────────

// ─── NUEVOS MENSAJES ───────────────────────────────────────

// Payload completo de un himno enviado por el controlador al display.
message HymnPayload {
  int32 hymn_id = 1;
  string titulo = 2;
  optional int32 numero = 3;
  string tipo = 4;             // "oficial" | "inspirada"
  int32 version_pais_id = 5;
  repeated StanzaPayload estrofas = 6;
}

// Una estrofa individual dentro del payload del himno.
message StanzaPayload {
  int32 id = 1;
  int32 version_pais_id = 2;
  string tipo = 3;             // "estrofa" | "coro" | "intro" | "amen"
  int32 orden = 4;
  string contenido = 5;
}

// Información de un fondo disponible en el PC.
message BackgroundInfo {
  int32 id = 1;
  string nombre = 2;
  string tipo = 3;             // "image" | "video" | "color"
}

// Lista de fondos disponibles en el PC.
message BackgroundList {
  repeated BackgroundInfo backgrounds = 1;
}

message Empty {}

enum CommandType {
  NEXT_STANZA = 0;
  PREV_STANZA = 1;
  GO_TO_CHORUS = 2;
  GO_TO_STANZA = 3;
  BLACKOUT = 4;
  CLEAR_BLACKOUT = 5;
  SET_TRANSPOSITION = 6;
  JUMP_TO_HYMN = 7;
  SET_BACKGROUND = 8;
  SET_FONT_SIZE = 9;
  PING = 10;
  SET_APPEARANCE = 11;
  // ─── BIBLE MODULE COMMANDS ─────────────────────────────────
  // Se reservan los valores 20+ para no colisionar con himnario.
  NEXT_VERSE = 20;
  PREV_VERSE = 21;
  NEXT_CHAPTER = 22;
  PREV_CHAPTER = 23;
  GO_TO_VERSE = 24;
  TOGGLE_FAVORITE = 25;
  SWITCH_TO_BIBLE = 26;
  SWITCH_TO_HIMNAL = 27;
  SET_EMITTER_VIEW_MODE = 28;
  SET_BIBLE_THEME = 29;
  SET_BIBLE_FONT_SCALE = 30;
}

message CommandRequest {
  CommandType type = 1;
  int32 stanza_index = 2;      // Para GO_TO_STANZA
  int32 semitones = 3;         // Para SET_TRANSPOSITION
  int32 hymn_id = 4;           // Para JUMP_TO_HYMN
  string background_id = 5;    // Para SET_BACKGROUND
  float font_size = 6;         // Para SET_FONT_SIZE
  // Nuevos campos para SET_APPEARANCE
  optional string text_color = 7;
  optional string chord_color = 8;
  optional string font_family = 9;
  optional bool is_bold = 10;
  optional bool show_chords = 11;
  optional float card_opacity = 12;
  optional float projection_font_scale = 13;
  optional string bg_color = 14;
  // ─── BIBLE COMMAND FIELDS ──────────────────────────────────
  // Tags 20+ reservados para Biblia (no colisionan con himnario).
  optional VerseReference target_verse = 20;  // GO_TO_VERSE
  optional ModuleType target_module = 21;     // SWITCH_TO_*
  optional EmitterViewMode view_mode = 22;    // SET_EMITTER_VIEW_MODE
  optional string bible_theme = 29;           // SET_BIBLE_THEME
  optional double bible_font_scale = 30;      // SET_BIBLE_FONT_SCALE
}

message CommandResponse {
  bool success = 1;
  string error_message = 2;
}

message DisplayStatus {
  int32 current_hymn_id = 1;
  string current_hymn_title = 2;
  int32 current_stanza_index = 3;
  int32 total_stanzas = 4;
  int32 transposition_semitones = 5;
  bool is_blackout = 6;
  string current_background_id = 7;
  float font_size = 8;
  string display_name = 9;
  // Nuevos campos de apariencia
  optional string text_color = 10;
  optional string chord_color = 11;
  optional string font_family = 12;
  optional bool is_bold = 13;
  optional bool show_chords = 14;
  optional float card_opacity = 15;
  optional float projection_font_scale = 16;
  // Contexto del módulo activo (Biblia o Himnario) para el emisor.
  // Tag 17 (libre; 15 y 16 ya usados por apariencia).
  optional ModuleContext module_context = 17;
  // Apariencia bíblica (solo cuando module = BIBLIA).
  optional string bible_theme = 18;
  optional double bible_font_scale = 19;
}

// ─── BIBLE MODULE MESSAGES ───────────────────────────────────────

// Referencia canónica a un versículo bíblico.
// `libro_numero` sigue el orden canónico (1..66), NO el id interno de la BD.
message VerseReference {
  int32 version_id = 1;
  int32 libro_numero = 2;
  int32 capitulo = 3;
  int32 versiculo = 4;
}

// Payload completo de un versículo para mostrar en el display remoto.
message VersePayload {
  VerseReference reference = 1;
  string libro_nombre = 2;
  string libro_abreviatura = 3;
  string texto = 4;
  string version_abreviatura = 5;
}

// Módulo actualmente activo en el display.
// 0 = UNKNOWN (default proto3 — no usar en código de negocio).
enum ModuleType {
  MODULE_UNKNOWN = 0;
  MODULE_BIBLIA = 1;
  MODULE_HIMNARIO = 2;
}

// Modo de vista del emisor (afecta cómo se muestra la preview en el celular).
// 0 = UNKNOWN; 1 = COMPACT (número + preview mini); 2 = PREVIEW (texto completo).
enum EmitterViewMode {
  VIEW_MODE_UNKNOWN = 0;
  VIEW_MODE_COMPACT = 1;
  VIEW_MODE_PREVIEW = 2;
}

// Contexto del módulo activo: qué se está mostrando y adyacentes (preview).
// `payload` es un `oneof` para que el mismo mensaje pueda portar Biblia
// o Himnario según `module`.
message ModuleContext {
  ModuleType module = 1;
  oneof payload {
    VersePayload current_verse = 2;
  }
  // Textos adyacentes para el modo PREVIEW del emisor.
  // Vacíos si el modo actual es COMPACT.
  string prev_text = 10;
  string current_text = 11;
  string next_text = 12;
}

message HandshakeRequest {
  string client_name = 1;
  string client_version = 2;
  int32 protocol_version = 3;
}

message HandshakeResponse {
  bool accepted = 1;
  string server_name = 2;
  string server_version = 3;
  string display_name = 4;
  int32 protocol_version = 5;
  string session_id = 6;
}
